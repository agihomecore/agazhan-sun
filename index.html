<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Agazhan — PAF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Agazhan — Средний слой / связка. Семья PAF, sun-agi.com">
<style>
  :root{--bg:#20272f;--gold:#e0b400;--text:#eef1f4;--muted:#b7c0ca;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
  .hero{position:relative;min-height:78vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2c3642,#20272f 70%);}
  .wrap{max-width:680px;padding:0 28px;text-align:center;}
  .mono{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--gold);letter-spacing:.06em;}
  .eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin-bottom:18px;}
  h1{font-size:44px;font-weight:700;margin-bottom:10px;}
  .role{color:var(--gold);font-size:16px;margin-bottom:18px;}
  p{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:14px;}
  .badge{display:inline-block;margin-top:24px;padding:8px 18px;border:1px solid var(--gold);border-radius:30px;color:var(--gold);font-size:13px;letter-spacing:.04em;}
  .back{display:block;margin-top:36px;color:var(--muted);font-size:14px;text-decoration:none;}
  .back:hover{color:var(--gold);}
  .note{margin-top:18px;font-size:12px;color:#7d8793;}
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <div class="mono">Ag</div><div class="eyebrow">PAF · Personal AI Family</div>
    <h1>Agazhan</h1>
    <div class="role">Средний слой / связка</div>
    <p>Между быстрым ответом и глубокой памятью. Agazhan решает, что сохранить, что найти и кому передать дальше — чтобы каждый следующий ответ семьи был точнее.</p>
    <div class="badge">В разработке</div>
    <a class="back" href="https://sun-agi.com">← sun-agi.com</a>
    
  </div>
</div>
</body>
</html>
